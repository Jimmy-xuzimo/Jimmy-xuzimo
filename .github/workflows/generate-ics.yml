name: Generate ICS

on:
  push:
    paths:
      - 'gen_ics.py'
      - '.github/workflows/generate-ics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run generator
        run: python3 gen_ics.py
      - name: Commit schedule.ics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.ics
          git commit -m "Auto-generate schedule.ics" || echo "no changes"
          git push
