name: Update profile stats

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Generate light stats
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=Jimmy-xuzimo&show_icons=true&hide_rank=true&theme=default&title_color=0969da&icon_color=d29922&border_color=d1d9e0&disable_animations=true
          path: assets/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Generate dark stats
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=Jimmy-xuzimo&show_icons=true&hide_rank=true&theme=github_dark&title_color=79c0ff&icon_color=e3b341&border_color=30363d&disable_animations=true
          path: assets/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Publish stats
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats-*.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: refresh GitHub stats'
          git pull --rebase origin main
          git push origin HEAD:main
